
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>共有結合パズル（電子対モデル）</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #333;
            user-select: none;
            -webkit-user-select: none; /* iOS対策 */
            overflow: hidden;
            touch-action: none; /* 画面全体のスクロール・ズームを完全に禁止 */
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        /* 原子の供給プール */
        #atom-pool {
            background-color: #1e293b;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 30;
            touch-action: none;
        }
        .pool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: bold;
        }
        /* 実験ステージ */
        #game-area {
            flex: 1;
            position: relative;
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            touch-action: none;
        }
        /* ゴミ箱エリア */
        #trash-zone {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background-color: #ef4444;
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            z-index: 20;
            opacity: 0.6;
            transition: all 0.2s;
        }
        #trash-zone.hover {
            opacity: 1;
            transform: scale(1.1);
        }
        /* 下部操作パネル */
        #control-panel {
            height: 70px;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 30;
        }
        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent; /* タップ時の青枠消去 */
        }
        #check-btn { background-color: #2563eb; color: white; }
        #check-btn:hover { background-color: #1d4ed8; }
        #reset-btn { background-color: #64748b; color: white; }
        
        /* 原子要素のスタイル */
        .atom {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.4rem;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: grab;
            z-index: 10;
            touch-action: none; /* 個別要素の挙動固定 */
        }
        
        /* プール内にある原寸見本 */
        .pool-atom {
            position: static !important;
            cursor: grab;
        }
        
        /* 原子ごとの色設定 */
        .atom-H { background-color: #84cc16; color: #1e293b; } /* 水素 */
        .atom-C { background-color: #475569; } /* 炭素 */
        .atom-N { background-color: #3b82f6; } /* 窒素 */
        .atom-O { background-color: #ef4444; } /* 酸素 */
        .atom-Cl { background-color: #10b981; } /* 塩素 */

        /* 電子ドットを描画するSVGレイヤー */
        #svg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="atom-pool">
        <div class="pool-item">
            <div class="atom atom-H pool-atom" data-type="H">H</div>
            <span>水素 (1)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-C pool-atom" data-type="C">C</div>
            <span>炭素 (4)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-N pool-atom" data-type="N">N</div>
            <span>窒素 (3)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-O pool-atom" data-type="O">O</div>
            <span>酸素 (2)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-Cl pool-atom" data-type="Cl">Cl</div>
            <span>塩素 (1)</span>
        </div>
    </div>

    <div id="game-area">
        <svg id="svg-lines"></svg>
        <div id="trash-zone">🗑️</div>
    </div>

    <div id="control-panel">
        <button id="reset-btn" class="btn" onclick="clearStage()">全部消去</button>
        <button id="check-btn" class="btn" onclick="checkBonds()">結合チェック</button>
    </div>
</div>

<script>
    const atomConfig = {
        'H':  { valency: 1 },
        'Cl': { valency: 1 },
        'O':  { valency: 2 },
        'N':  { valency: 3 },
        'C':  { valency: 4 }
    };

    let activeAtoms = [];
    let draggedElement = null;
    let isNewAtom = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let atomCounter = 0;

    const gameArea = document.getElementById('game-area');
    const svgLines = document.getElementById('svg-lines');
    const trashZone = document.getElementById('trash-zone');

    // 初期化：PC用とタブレット用両方のイベントを登録
    document.querySelectorAll('.pool-atom').forEach(poolAtom => {
        poolAtom.addEventListener('mousedown', startDragFromPool);
        poolAtom.addEventListener('touchstart', startDragFromPool, { passive: false });
    });

    // タブレットのマルチタッチ誤動作を防ぐため、最初の指の座標のみ取得する関数
    function getEventCoords(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    function startDragFromPool(e) {
        e.preventDefault(); // タブレットの画面スクロールを完全にブロック
        const coords = getEventCoords(e);
        const type = e.currentTarget.dataset.type;

        const newAtom = document.createElement('div');
        newAtom.className = `atom atom-${type}`;
        newAtom.innerText = type;
        newAtom.dataset.type = type;
        newAtom.id = `atom-gen-${atomCounter++}`;

        const areaRect = gameArea.getBoundingClientRect();
        // 指の真下に原子の中心がくるように配置（半径37.5px分オフセット）
        newAtom.style.left = `${coords.x - areaRect.left - 37.5}px`;
        newAtom.style.top = `${coords.y - areaRect.top - 37.5}px`;

        gameArea.appendChild(newAtom);

        draggedElement = newAtom;
        isNewAtom = true;
        dragOffsetX = 37.5;
        dragOffsetY = 37.5;

        // ドキュメント全体にイベントを広げて、指が要素から外れてもドラッグを維持させる（タブレットの標準仕様）
        document.addEventListener('mousemove', drag, { passive: false });
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    }

    function startDragFromStage(e) {
        e.preventDefault();
        e.stopPropagation();
        const coords = getEventCoords(e);
        
        draggedElement = e.currentTarget;
        isNewAtom = false;
        const rect = draggedElement.getBoundingClientRect();
        
        dragOffsetX = coords.x - rect.left;
        dragOffsetY = coords.y - rect.top;

        document.addEventListener('mousemove', drag, { passive: false });
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    }

    function drag(e) {
        if (!draggedElement) return;
        e.preventDefault(); // スクロールバウンス対策
        
        const coords = getEventCoords(e);
        const areaRect = gameArea.getBoundingClientRect();
        
        let x = coords.x - areaRect.left - dragOffsetX;
        let y = coords.y - areaRect.top - dragOffsetY;

        // ステージからはみ出さないようにガード
        x = Math.max(0, Math.min(x, areaRect.width - 75));
        y = Math.max(-50, Math.min(y, areaRect.height - 75));

        draggedElement.style.left = `${x}px`;
        draggedElement.style.top = `${y}px`;

        // ゴミ箱の判定
        const trashRect = trashZone.getBoundingClientRect();
        if (coords.x >= trashRect.left && coords.x <= trashRect.right &&
            coords.y >= trashRect.top && coords.y <= trashRect.bottom) {
            trashZone.classList.add('hover');
        } else {
            trashZone.classList.remove('hover');
        }

        updateBonds();
    }

    function endDrag(e) {
        if (!draggedElement) return;

        const coords = getEventCoords(e);
        const trashRect = trashZone.getBoundingClientRect();
        const areaRect = gameArea.getBoundingClientRect();

        // ゴミ箱エリアで離した、または上のプールに戻した場合は削除
        if ((coords.x >= trashRect.left && coords.x <= trashRect.right &&
             coords.y >= trashRect.top && coords.y <= trashRect.bottom) || (coords.y < areaRect.top + 10)) {
            draggedElement.remove();
            activeAtoms = activeAtoms.filter(a => a.id !== draggedElement.id);
        } 
        else if (isNewAtom) {
            const atomId = draggedElement.id;
            const type = draggedElement.dataset.type;
            
            // 新規追加された原子に、ステージ移動用のイベントを再登録
            draggedElement.addEventListener('mousedown', startDragFromStage);
            draggedElement.addEventListener('touchstart', startDragFromStage, { passive: false });

            activeAtoms.push({
                id: atomId,
                type: type,
                el: draggedElement,
                valency: atomConfig[type].valency,
                connected: 0
            });
        }

        trashZone.classList.remove('hover');
        draggedElement = null;
        isNewAtom = false;

        document.removeEventListener('mousemove', drag);
        document.removeEventListener('touchmove', drag);
        
        updateBonds();
    }

    function getDistance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    }

    // リアルタイム電子ドット描画
    function updateBonds() {
        svgLines.innerHTML = '';
        const threshold = 125;
        const radius = 37.5;

        activeAtoms = activeAtoms.filter(a => document.getElementById(a.id));
        activeAtoms.forEach(a => {
            a.connected = 0;
            a.partners = [];
        });

        for (let i = 0; i < activeAtoms.length; i++) {
            for (let j = i + 1; j < activeAtoms.length; j++) {
                const a1 = activeAtoms[i];
                const a2 = activeAtoms[j];

                const r1 = a1.el.getBoundingClientRect();
                const r2 = a2.el.getBoundingClientRect();
                const areaRect = gameArea.getBoundingClientRect();

                const x1 = r1.left + radius - areaRect.left;
                const y1 = r1.top + radius - areaRect.top;
                const x2 = r2.left + radius - areaRect.left;
                const y2 = r2.top + radius - areaRect.top;

                const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

                if (dist < threshold) {
                    let bondCount = 1;
                    if (a1.type === 'N' && a2.type === 'N') bondCount = 3;
                    else if ((a1.type === 'C' && a2.type === 'O') || (a1.type === 'O' && a2.type === 'C')) bondCount = 2;

                    a1.connected += bondCount;
                    a2.connected += bondCount;
                    
                    a1.partners.push({ atom: a2, count: bondCount, x: x2, y: y2 });
                    a2.partners.push({ atom: a1, count: bondCount, x: x1, y: y1 });

                    drawSharedElectrons(x1, y1, x2, y2, bondCount);
                }
            }
        }

        activeAtoms.forEach(a => {
            const r = a.el.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            const cx = r.left + radius - areaRect.left;
            const cy = r.top + radius - areaRect.top;

            drawUnsharedElectrons(cx, cy, a);
        });
    }

    function drawSharedElectrons(x1, y1, x2, y2, count) {
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.sqrt(dx*dx + dy*dy);
        const ux = dx / len;
        const uy = dy / len;
        const nx = -uy;
        const ny = ux;

        if (count === 1) {
            createDot(mx + nx * 5 - ux * 4, my + ny * 5 - uy * 4, '#ef4444');
            createDot(mx - nx * 5 + ux * 4, my - ny * 5 + uy * 4, '#ef4444');
        } else if (count === 2) {
            createDot(mx + nx * 12 - ux * 4, my + ny * 12 - uy * 4, '#ef4444');
            createDot(mx + nx * 4 + ux * 4, my + ny * 4 + uy * 4, '#ef4444');
            createDot(mx - nx * 4 - ux * 4, my - ny * 4 - uy * 4, '#ef4444');
            createDot(mx - nx * 12 + ux * 4, my - ny * 12 + uy * 4, '#ef4444');
        } else if (count === 3) {
            for(let i = -1; i <= 1; i++) {
                let ox = mx + nx * (i * 12);
                let oy = my + ny * (i * 12);
                createDot(ox - ux * 4, oy - uy * 4, '#ef4444');
                createDot(ox + ux * 4, oy + uy * 4, '#ef4444');
            }
        }
    }

    function drawUnsharedElectrons(cx, cy, atom) {
        const totalValence = {'H':1, 'Cl':7, 'O':6, 'N':5, 'C':4}[atom.type];
        let displayCount = totalValence + atom.connected; 
        if (atom.type === 'H') displayCount = Math.min(displayCount, 2);
        else displayCount = Math.min(displayCount, 8);

        let remainingDots = displayCount - (atom.connected * 2);
        if (remainingDots <= 0) return;

        const directions = [
            {x: 0, y: -1}, // 上
            {x: 1, y: 0},  // 右
            {x: 0, y: 1},  // 下
            {x: -1, y: 0}  // 左
        ];

        atom.partners.forEach(p => {
            const pdx = p.x - cx;
            const pdy = p.y - cy;
            if (Math.abs(pdx) > Math.abs(pdy)) {
                if (pdx > 0) directions[1].blocked = true;
                else directions[3].blocked = true;
            } else {
                if (pdy > 0) directions[2].blocked = true;
                else directions[0].blocked = true;
            }
        });

        let dirIndex = 0;
        const r_dot = 43; 
        
        while (remainingDots > 0 && dirIndex < 4) {
            const dir = directions[dirIndex];
            if (!dir.blocked) {
                if (remainingDots >= 2 && atom.type !== 'H') {
                    let dx1 = cx + dir.x * r_dot - dir.y * 6;
                    let dy1 = cy + dir.y * r_dot + dir.x * 6;
                    let dx2 = cx + dir.x * r_dot + dir.y * 6;
                    let dy2 = cy + dir.y * r_dot - dir.x * 6;
                    createDot(dx1, dy1, '#3b82f6');
                    createDot(dx2, dy2, '#3b82f6');
                    remainingDots -= 2;
                } else {
                    let dx = cx + dir.x * r_dot;
                    let dy = cy + dir.y * r_dot;
                    createDot(dx, dy, '#f59e0b');
                    remainingDots -= 1;
                }
            }
            dirIndex++;
        }
    }

    function createDot(x, y, color) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', 5);
        circle.setAttribute('fill', color);
        svgLines.appendChild(circle);
    }

    function checkBonds() {
        activeAtoms = activeAtoms.filter(a => document.getElementById(a.id));
        updateBonds();
        
        if (activeAtoms.length === 0) {
            alert("ステージに原子がありません。");
            return;
        }

        let isCorrect = true;
        for (let atom of activeAtoms) {
            if (atom.connected !== atom.valency) {
                isCorrect = false;
                break;
            }
        }

        if (isCorrect) {
            alert("🎉 大正解！綺麗に電子が共有され、すべての原子が安定しました！スクショを撮って提出しましょう！");
        } else {
            alert("❌ 不対電子（オレンジのドット）が残っているか、電子の共有数が正しくありません。すべての電子が綺麗にペアになるよう調整してみましょう。");
        }
    }

    function clearStage() {
        if (confirm("ステージ上のすべての原子を消去しますか？")) {
            activeAtoms.forEach(a => {
                const el = document.getElementById(a.id);
                if (el) el.remove();
            });
            activeAtoms = [];
            svgLines.innerHTML = '';
        }
    }

    // 画面の向きが変わった際（縦・横切り替え）もドットの位置を再計算する
    window.addEventListener('resize', updateBonds);
    window.addEventListener('orientationchange', () => {
        setTimeout(updateBonds, 200);
    });
</script>
