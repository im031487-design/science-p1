<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>共有結合パズル（スクショ提出版）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
    <div id="atom-pool">
        <div class="pool-item">
            <div class="atom atom-H pool-atom" data-type="H">H</div>
            <span>水素 (1)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-C pool-atom" data-type="C">C</div>
            <span>炭素 (4)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-N pool-atom" data-type="N">N</div>
            <span>窒素 (3)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-O pool-atom" data-type="O">O</div>
            <span>酸素 (2)</span>
        </div>
        <div class="pool-item">
            <div class="atom atom-Cl pool-atom" data-type="Cl">Cl</div>
            <span>塩素 (1)</span>
        </div>
    </div>

    <div id="game-area">
        <svg id="svg-lines"></svg>
        
        <div id="trash-zone">🗑️</div>
    </div>

    <div id="control-panel">
        <button id="reset-btn" class="btn" onclick="clearStage()">全部消去</button>
        <button id="check-btn" class="btn" onclick="checkBonds()">結合チェック</button>
    </div>
</div>

<script>
    const atomConfig = {
        'H':  { valency: 1 },
        'Cl': { valency: 1 },
        'O':  { valency: 2 },
        'N':  { valency: 3 },
        'C':  { valency: 4 }
    };

    let activeAtoms = [];
    let draggedElement = null;
    let isNewAtom = false; // プールから引っ張り出している最中かどうかのフラグ
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let atomCounter = 0;

    const gameArea = document.getElementById('game-area');
    const svgLines = document.getElementById('svg-lines');
    const trashZone = document.getElementById('trash-zone');

    // 初期化：プール内の原子にドラッグイベントを付与
    document.querySelectorAll('.pool-atom').forEach(poolAtom => {
        poolAtom.addEventListener('mousedown', startDragFromPool);
        poolAtom.addEventListener('touchstart', startDragFromPool, { passive: false });
    });

    // プールからドラッグを始めたときの処理（新しい原子を生成する）
    function startDragFromPool(e) {
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const type = e.currentTarget.dataset.type;

        // ステージ上に新しい原子を生成
        const newAtom = document.createElement('div');
        newAtom.className = `atom atom-${type}`;
        newAtom.innerText = type;
        newAtom.dataset.type = type;
        newAtom.id = `atom-generated-${atomCounter++}`;

        // 初期位置を一旦プールの位置（画面最上部付近）に合わせる
        const areaRect = gameArea.getBoundingClientRect();
        newAtom.style.left = `${clientX - areaRect.left - 32}px`;
        newAtom.style.top = `${clientY - areaRect.top - 32}px`;

        gameArea.appendChild(newAtom);

        draggedElement = newAtom;
        isNewAtom = true;
        dragOffsetX = 32;
        dragOffsetY = 32;

        // 動かすためのイベントを登録
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    }

    // ステージ上の原子のドラッグ開始
    function startDragFromStage(e) {
        e.preventDefault();
        e.stopPropagation();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        draggedElement = e.currentTarget;
        isNewAtom = false;
        const rect = draggedElement.getBoundingClientRect();
        
        dragOffsetX = clientX - rect.left;
        dragOffsetY = clientY - rect.top;

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    }

    // ドラッグ中（共通）
    function drag(e) {
        if (!draggedElement) return;
        e.preventDefault();
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const areaRect = gameArea.getBoundingClientRect();
        
        let x = clientX - areaRect.left - dragOffsetX;
        let y = clientY - areaRect.top - dragOffsetY;

        // ステージ外（左右下）へのはみ出し防止
        x = Math.max(0, Math.min(x, areaRect.width - 65));
        y = Math.max(-50, Math.min(y, areaRect.height - 65)); // プール側に戻りやすくするため上方向は少し緩く

        draggedElement.style.left = `${x}px`;
        draggedElement.style.top = `${y}px`;

        // ゴミ箱のホバー判定
        const trashRect = trashZone.getBoundingClientRect();
        if (clientX >= trashRect.left && clientX <= trashRect.right &&
            clientY >= trashRect.top && clientY <= trashRect.bottom) {
            trashZone.classList.add('hover');
        } else {
            trashZone.classList.remove('hover');
        }

        updateBonds();
    }

    // ドラッグ終了
    function endDrag(e) {
        if (!draggedElement) return;

        const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const trashRect = trashZone.getBoundingClientRect();
        const areaRect = gameArea.getBoundingClientRect();

        // 1. ゴミ箱の上で離した、またはプールに戻そうとした場合は削除
        if ((clientX >= trashRect.left && clientX <= trashRect.right &&
             clientY >= trashRect.top && clientY <= trashRect.bottom) || (clientY < areaRect.top + 10)) {
            draggedElement.remove();
            activeAtoms = activeAtoms.filter(a => a.id !== draggedElement.id);
        } 
        // 2. プールからステージに引っ張り出してきた場合の確定処理
        else if (isNewAtom) {
            const atomId = draggedElement.id;
            const type = draggedElement.dataset.type;
            
            // ステージ上の原子としてイベントを再登録
            draggedElement.addEventListener('mousedown', startDragFromStage);
            draggedElement.addEventListener('touchstart', startDragFromStage, { passive: false });

            activeAtoms.push({
                id: atomId,
                type: type,
                el: draggedElement,
                valency: atomConfig[type].valency,
                connected: 0
            });
        }

        trashZone.classList.remove('hover');
        draggedElement = null;
        isNewAtom = false;

        document.removeEventListener('mousemove', drag);
        document.removeEventListener('touchmove', drag);
        
        updateBonds();
    }

    function getDistance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    }

    // リアルタイム結合線描画
    function updateBonds() {
        svgLines.innerHTML = '';
        const threshold = 110;

        // 全原子の接続数を初期化
        activeAtoms.forEach(a => a.connected = 0);

        for (let i = 0; i < activeAtoms.length; i++) {
            for (let j = i + 1; j < activeAtoms.length; j++) {
                const a1 = activeAtoms[i];
                const a2 = activeAtoms[j];

                // 既に削除された要素が配列に残っていた場合のスキップ処理
                if (!document.getElementById(a1.id) || !document.getElementById(a2.id)) continue;

                const r1 = a1.el.getBoundingClientRect();
                const r2 = a2.el.getBoundingClientRect();
                const areaRect = gameArea.getBoundingClientRect();

                const x1 = r1.left + 32.5 - areaRect.left;
                const y1 = r1.top + 32.5 - areaRect.top;
                const x2 = r2.left + 32.5 - areaRect.left;
                const y2 = r2.top + 32.5 - areaRect.top;

                const dist = getDistance(x1, y1, x2, y2);

                if (dist < threshold) {
                    let bondCount = 1;
                    
                    // 特殊判定：窒素同士＝3本、炭素と酸素＝2本
                    if (a1.type === 'N' && a2.type === 'N') {
                        bondCount = 3;
                    } else if ((a1.type === 'C' && a2.type === 'O') || (a1.type === 'O' && a2.type === 'C')) {
                        bondCount = 2;
                    }

                    a1.connected += bondCount;
                    a2.connected += bondCount;

                    drawBondLine(x1, y1, x2, y2, bondCount);
                }
            }
        }
    }

    function drawBondLine(x1, y1, x2, y2, count) {
        if (count === 1) {
            createLine(x1, y1, x2, y2, 4);
        } else if (count === 2) {
            createLine(x1-5, y1-5, x2-5, y2-5, 3);
            createLine(x1+5, y1+5, x2+5, y2+5, 3);
        } else if (count === 3) {
            createLine(x1, y1, x2, y2, 3);
            createLine(x1-9, y1-9, x2-9, y2-9, 3);
            createLine(x1+9, y1+9, x2+9, y2+9, 3);
        }
    }

    function createLine(x1, y1, x2, y2, width) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#475569');
        line.setAttribute('stroke-width', width);
        svgLines.appendChild(line);
    }

    // 全体正誤判定
    function checkBonds() {
        // 現在有効な原子だけを精査
        activeAtoms = activeAtoms.filter(a => document.getElementById(a.id));
        updateBonds();
        
        if (activeAtoms.length === 0) {
            alert("ステージに原子がありません。プールからドラッグして配置してください。");
            return;
        }

        let isCorrect = true;
        for (let atom of activeAtoms) {
            if (atom.connected !== atom.valency) {
                isCorrect = false;
                break;
            }
        }

        if (isCorrect) {
            alert("🎉 すべての分子が正しく結合しています！この画面のスクリーンショットを撮って先生に提出しましょう！");
        } else {
            alert("❌ 結合の手が余っているか、過剰に結ばれている原子があります。もう一度確認してみましょう。");
        }
    }

    // ステージを空にする
    function clearStage() {
        if (confirm("ステージ上のすべての原子を消去しますか？")) {
            activeAtoms.forEach(a => {
                const el = document.getElementById(a.id);
                if (el) el.remove();
            });
            activeAtoms = [];
            svgLines.innerHTML = '';
        }
    }

    window.onresize = () => { updateBonds(); };
</script>

</body>
</html>
